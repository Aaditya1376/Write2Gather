
name: Deploy Write2Gather

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build website
        run: npm run build -- --base=/Write2Gather/
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Warn if the API is not configured
        if: ${{ vars.VITE_API_URL == '' }}
        run: echo "::warning::VITE_API_URL is empty; sign-in and document features need a deployed API server."

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
